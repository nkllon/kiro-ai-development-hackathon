[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-discovery-core"
version = "0.1.0"
description = "Core repository discovery modules extracted from the Beast Mode toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Beast Mode Framework", email = "beast@mode.dev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "typing-extensions>=4.8.0; python_version < '3.11'",
    "chardet>=5.0.0",
]

[project.optional-dependencies]
rm-ddd = ["rm-ddd-core>=0.1.0"]

[project.urls]
Homepage = "https://github.com/beast-mode/kiro-ai-development-hackathon"
Repository = "https://github.com/beast-mode/kiro-ai-development-hackathon"

[tool.hatch.build.targets.wheel]
packages = [
    {include = "repo_discovery_core", from = "../../src"},
]

[tool.hatch.build.targets.sdist]
include = [
    "src/repo_discovery_core",
    "README.md",
]

