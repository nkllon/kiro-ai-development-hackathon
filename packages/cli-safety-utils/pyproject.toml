[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-safety-utils"
version = "0.1.0"
description = "Reusable shell command safety utilities from the Beast Mode toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Beast Mode Framework", email = "beast@mode.dev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "typing-extensions>=4.8.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/beast-mode/kiro-ai-development-hackathon"
Repository = "https://github.com/beast-mode/kiro-ai-development-hackathon"

[tool.hatch.build.targets.wheel]
packages = [
    {include = "cli_safety", from = "../../src"},
]

[tool.hatch.build.targets.sdist]
include = [
    "src/cli_safety",
    "README.md",
]

