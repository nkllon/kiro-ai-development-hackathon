[supervisord]
nodaemon=true
user=app
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid

[program:observatory]
command=python -m src.beast_mode.observatory.main
directory=/app
user=app
autostart=true
autorestart=true
stderr_logfile=/app/logs/observatory.err.log
stdout_logfile=/app/logs/observatory.out.log
environment=PYTHONPATH="/app"

[program:cloudflared]
command=cloudflared tunnel --config /home/app/.cloudflared/config.yml run observatory-tunnel
directory=/app
user=app
autostart=true
autorestart=true
stderr_logfile=/app/logs/cloudflared.err.log
stdout_logfile=/app/logs/cloudflared.out.log