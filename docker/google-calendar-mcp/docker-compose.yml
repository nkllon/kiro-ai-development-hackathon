version: '3.8'

services:
  google-calendar-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google_calendar_mcp
    ports:
      - "${GOOGLE_CALENDAR_PORT:-3003}:3500"
    environment:
      - NODE_ENV=production
      - GOOGLE_OAUTH_CREDENTIALS=/app/credentials/gcp-oauth.keys.json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_SERVER_NAME=google-calendar
    volumes:
      # Mount credentials (create this directory and add your OAuth credentials)
      - ./credentials:/app/credentials:ro
      # Mount tokens for persistence
      - google_calendar_tokens:/app/tokens
      # Mount logs for debugging
      - google_calendar_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - beast_mode_network

  # Beast Mode Monitoring Stack (MANDATORY for Beast Mode compliance)
  prometheus:
    image: prom/prometheus:latest
    container_name: google_calendar_prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - beast_mode_network

  grafana:
    image: grafana/grafana:latest
    container_name: google_calendar_grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - beast_mode_network

volumes:
  google_calendar_tokens:
  google_calendar_logs:
  prometheus_data:
  grafana_data:

networks:
  beast_mode_network:
    driver: bridge