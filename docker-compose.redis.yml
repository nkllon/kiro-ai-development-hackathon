# Redis for Beast Mode Observatory - Quick Start Configuration
# Based on beast-mode-observatory-v1 branch requirements
#
# NOTE: Uses port 6380 externally to avoid conflict with existing Redis cluster on 6379
#
# Usage:
#   docker-compose -f docker-compose.redis.yml up -d
#   docker-compose -f docker-compose.redis.yml down
#   docker-compose -f docker-compose.redis.yml logs -f redis

services:
  redis:
    image: redis:7-alpine
    container_name: beast-mode-redis
    restart: unless-stopped
    
    # Redis server command with basic security
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-beastmode2025}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --loglevel notice
      --notify-keyspace-events Ex
    
    # Port mapping - Using 6380 to avoid conflict with existing cluster on 6379
    ports:
      - "${REDIS_PORT:-6380}:6379"
    
    # Environment variables
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-beastmode2025}
      - TZ=America/Los_Angeles
    
    # Persistent storage
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis
    
    # Network
    networks:
      - beast-mode-network
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-beastmode2025}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis Commander - Web UI for Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: beast-mode-redis-commander
    restart: unless-stopped
    
    environment:
      - REDIS_HOSTS=local:beast-mode-redis:6379:0:${REDIS_PASSWORD:-beastmode2025}
      - HTTP_USER=admin
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-admin}
    
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    
    networks:
      - beast-mode-network
    
    depends_on:
      redis:
        condition: service_healthy
    
    profiles:
      - tools
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # Optional: Redis Exporter for Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: beast-mode-redis-exporter
    restart: unless-stopped
    
    environment:
      - REDIS_ADDR=redis://beast-mode-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-beastmode2025}
    
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    
    networks:
      - beast-mode-network
    
    depends_on:
      redis:
        condition: service_healthy
    
    profiles:
      - monitoring
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

# Named volumes
volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-./data/redis}
  
  redis_logs:
    driver: local

# Network
networks:
  beast-mode-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

