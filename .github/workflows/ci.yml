name: Beast Mode Framework CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

env:
  PYTHONPATH: src

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -e ".[dev]"
        pip install pytest-asyncio redis

    - name: Run linting
      run: |
        ruff check src/ tests/
        black --check src/ tests/

    - name: Run type checking
      run: |
        mypy src/

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v
      env:
        PYTHONPATH: ${{ env.PYTHONPATH }}
        REDIS_URL: redis://localhost:6379

    - name: Run Observatory smoke tests
      if: matrix.python-version == '3.11'
      run: |
        # Run critical Observatory tests as part of main CI
        pytest tests/unit/beast_mode/observatory/test_simple_smoke.py -v --tb=short
      env:
        REDIS_URL: redis://localhost:6379

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run full quality check
      run: |
        make quality

    - name: Check Beast Mode CLI
      run: |
        beast-mode --help
        kiro-discovery --help

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test Docker builds
      run: |
        # Test Google Calendar MCP build
        cd docker/google-calendar-mcp
        docker build -t beast-mode/google-calendar-mcp:test .

        # Test Google Workspace MCP build
        cd ../google-workspace-mcp
        docker build -t beast-mode/google-workspace-mcp:test .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Bandit security scan
      uses: securecodewarrior/github-action-bandit@v1
      with:
        path: src/

    - name: Run Safety check
      run: |
        pip install safety
        safety check --file pyproject.toml

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [test, quality-gate, security-scan]

    steps:
    - uses: actions/checkout@v4

    - name: Check release readiness
      run: |
        echo "✅ All quality gates passed"
        echo "✅ Security scans completed"
        echo "✅ Tests passed across Python versions"
        echo "🚀 Ready for release!"