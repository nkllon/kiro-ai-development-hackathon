name: SonarCloud Analysis

on:
  push:
    branches:
      - master
      - main
      - rc1-patch
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - main
      - rc1-patch

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Disable shallow clone for better analysis
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      # Optional: Run tests and generate coverage
      # Uncomment if you want coverage analysis
      # - name: Run tests with coverage
      #   run: |
      #     pip install pytest pytest-cov
      #     pytest --cov=src --cov-report=xml --cov-report=term
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=nkllon_kiro-ai-development-hackathon
            -Dsonar.organization=nkllon
      
      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Optional: Uncomment to fail the build if quality gate fails
        # continue-on-error: false

