# MSP SSL Chaos Tamer - Docker Compose Configuration
# Production-ready deployment with monitoring and persistence

version: '3.8'

services:
  # Main MSP SSL Chaos Tamer application
  msp-ssl-chaos-tamer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-1.0.0}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
    image: msp-ssl-chaos-tamer:${VERSION:-latest}
    container_name: msp-ssl-chaos-tamer
    restart: unless-stopped
    
    # Environment configuration
    environment:
      - MSP_SSL_ENVIRONMENT=${ENVIRONMENT:-production}
      - MSP_SSL_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MSP_SSL_MASTER_KEY=${MSP_SSL_MASTER_KEY}
      - MSP_SSL_DATABASE_URL=sqlite:///app/data/certificates.db
      - MSP_SSL_CREDENTIALS_PATH=/app/data/credentials.enc
      - MSP_SSL_PROMETHEUS_PORT=9090
      - MSP_SSL_WEB_PORT=8080
      - MSP_SSL_SECURE_PORT=8443
    
    # Port mappings
    ports:
      - "${WEB_PORT:-8080}:8080"           # Web interface
      - "${SECURE_PORT:-8443}:8443"       # Secure web interface
      - "${METRICS_PORT:-9090}:9090"      # Prometheus metrics
    
    # Volume mounts for persistence
    volumes:
      - msp_ssl_data:/app/data
      - msp_ssl_logs:/app/logs
      - msp_ssl_config:/app/config
      - msp_ssl_backups:/app/backups
      - /etc/localtime:/etc/localtime:ro
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    
    # Health check
    healthcheck:
      test: ["CMD", "./healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network
    networks:
      - msp-ssl-network
    
    # Dependencies
    depends_on:
      - prometheus
      - grafana

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.40.0
    container_name: msp-ssl-prometheus
    restart: unless-stopped
    
    # Command line arguments
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    networks:
      - msp-ssl-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:9.3.0
    container_name: msp-ssl-grafana
    restart: unless-stopped
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-public-config.ini:/etc/grafana/conf.d/custom.ini:ro
    
    networks:
      - msp-ssl-network
    
    depends_on:
      - prometheus
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: msp-ssl-redis
    restart: unless-stopped
    
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-mspssl123}
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
    
    volumes:
      - redis_data:/data
    
    networks:
      - msp-ssl-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: msp-ssl-nginx
    restart: unless-stopped
    
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    
    networks:
      - msp-ssl-network
    
    depends_on:
      - msp-ssl-chaos-tamer
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

# Named volumes for data persistence
volumes:
  msp_ssl_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}
  
  msp_ssl_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_PATH:-./logs}
  
  msp_ssl_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CONFIG_PATH:-./config}
  
  msp_ssl_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUPS_PATH:-./backups}
  
  prometheus_data:
    driver: local
  
  grafana_data:
    driver: local
  
  redis_data:
    driver: local
  
  nginx_logs:
    driver: local

# Network configuration
networks:
  msp-ssl-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16