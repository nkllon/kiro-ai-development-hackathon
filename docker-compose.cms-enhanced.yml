version: '3.8'

services:
  # PostgreSQL Database for Directus
  postgres:
    image: postgres:15-alpine
    container_name: cms_postgres
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - cms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Directus CMS with Enhanced Configuration
  directus:
    image: directus/directus:latest
    container_name: cms_directus
    ports:
      - "8055:8055"
    environment:
      # Database Configuration
      KEY: "${DIRECTUS_KEY:-directus-key-change-in-production}"
      SECRET: "${DIRECTUS_SECRET:-directus-secret-change-in-production}"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: "${DB_PASSWORD:-directus}"
      
      # Admin User Configuration
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@directus.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-directus}"
      
      # Security Configuration
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      
      # API Configuration
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8055}"
      
      # File Storage Configuration
      STORAGE_LOCATIONS: "local"
      STORAGE_LOCAL_DRIVER: "local"
      STORAGE_LOCAL_ROOT: "./uploads"
      
      # Email Configuration
      EMAIL_FROM: "${EMAIL_FROM:-no-reply@directus.local}"
      EMAIL_TRANSPORT: "smtp"
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST:-localhost}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT:-587}"
      
      # Logging Configuration
      LOG_LEVEL: "info"
      LOG_STYLE: "pretty"
      
      # Cache Configuration with Redis
      CACHE_ENABLED: "true"
      CACHE_STORE: "redis"
      CACHE_REDIS: "redis://redis:6379"
      
      # Rate Limiting with Redis
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_STORE: "redis"
      RATE_LIMITER_REDIS: "redis://redis:6379"
      RATE_LIMITER_POINTS: "25"
      RATE_LIMITER_DURATION: "1"
      
      # WebSocket Configuration
      WEBSOCKETS_ENABLED: "true"
      
      # Extensions Configuration
      EXTENSIONS_PATH: "./extensions"
      
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
      - ./directus/snapshots:/directus/snapshots
      - ./directus/extensions:/directus/extensions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8055/server/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: cms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Elasticsearch for search functionality
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: cms_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - cms_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Kibana for Elasticsearch management (optional)
  kibana:
    image: kibana:8.11.0
    container_name: cms_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - cms_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # CMS Search Service (Custom service for search integration)
  cms-search:
    build:
      context: .
      dockerfile: Dockerfile.cms-search
    container_name: cms_search_service
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - DIRECTUS_URL=http://directus:8055
      - REDIS_URL=redis://redis:6379
    ports:
      - "8056:8056"
    depends_on:
      elasticsearch:
        condition: service_healthy
      directus:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8056/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Repository Sync Service
  cms-repo-sync:
    build:
      context: .
      dockerfile: Dockerfile.cms-repo-sync
    container_name: cms_repo_sync_service
    environment:
      - DIRECTUS_URL=http://directus:8055
      - DIRECTUS_TOKEN=${DIRECTUS_TOKEN}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./repositories:/app/repositories
      - repo_sync_data:/app/data
    depends_on:
      directus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cms_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8057/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  directus_uploads:
    driver: local
  directus_extensions:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  repo_sync_data:
    driver: local

networks:
  cms_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# Health check script for the entire stack
x-healthcheck-depends_on: &healthcheck-depends_on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  elasticsearch:
    condition: service_healthy
  directus:
    condition: service_healthy