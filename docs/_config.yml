title: Kiro AI Development Hackathon
description: Advanced AI Development Framework with Systematic Intelligence
baseurl: "/kiro-ai-development-hackathon"
url: "https://nkllon.github.io"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

navigation:
  - title: Home
    url: /
  - title: Getting Started
    url: /getting-started/
  - title: Documentation
    url: /documentation/
  - title: API Reference
    url: /api-reference/
  - title: Examples
    url: /examples/
  - title: Architecture
    url: /architecture/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

collections:
  docs:
    output: true
    permalink: /:collection/:name/