[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiro-ai-development-hackathon"
version = "1.0.0"
description = "AI-Powered Spec-Driven Development Framework"
#readme = null  # To use: uncomment and replace null with value
requires-python = ">=3.9"
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]
dependencies = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "coverage>=7.0.0", "toml>=0.10.0", "prometheus-client>=0.20.0", "psutil>=5.9.0", "pydantic>=2.0.0", "click>=8.0.0", "rich>=13.0.0", "typer>=0.9.0", "transformers>=4.30.0", "torch>=2.0.0", "scikit-learn>=1.3.0", "numpy>=1.24.0", "datasets>=2.12.0", "cryptography>=3.4.0", "requests>=2.25.0", "google-api-python-client>=2.0.0", "google-auth-oauthlib>=0.5.0"]

[[project.authors]]
name = "Beast Mode Framework"
email = "beast@mode.dev"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = ["black>=23.0.0", "ruff>=0.1.0", "mypy>=1.0.0", "pre-commit>=3.0.0"]
monitoring = ["grafana-client>=3.0.0", "influxdb-client>=1.36.0"]
ml = ["tensorboard>=2.13.0", "wandb>=0.15.0", "jupyter>=1.0.0"]

[project.urls]
Homepage = "https://github.com/beast-mode/kiro-ai-development-hackathon"
Repository = "https://github.com/beast-mode/kiro-ai-development-hackathon"
Documentation = "https://beast-mode.github.io/kiro-ai-development-hackathon"

[project.scripts]
beast-mode = "src.beast_mode.cli:main"
kiro-discovery = "src.repository_discovery.cli:main"

[tool]

[tool.pytest]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')", "integration: marks tests as integration tests", "unit: marks tests as unit tests"]

[tool.coverage]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if self.debug:", "if settings.DEBUG", "raise AssertionError", "raise NotImplementedError", "if 0:", "if __name__ == .__main__.:", "class .*\\bProtocol\\):", "@(abc\\.)?abstractmethod"]

[tool.black]
line-length = 88
target-version = ["py39"]
include = "\\.pyi?$"
extend-exclude = "/(\n  # directories\n  \\.eggs\n  | \\.git\n  | \\.hg\n  | \\.mypy_cache\n  | \\.tox\n  | \\.venv\n  | build\n  | dist\n)/\n"

[tool.ruff]
target-version = "py39"
line-length = 88
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "psutil.*"]
ignore_missing_imports = true

[tool.hatch]

[tool.hatch.build]

[tool.hatch.build.targets]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
]
