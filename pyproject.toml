[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beast-mode-framework"
version = "1.0.0"
description = "Systematic AI-Powered Development Framework with Domain-Driven Design"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Beast Mode Development Team", email = "team@beastmode.dev"}
]
maintainers = [
    {name = "Beast Mode Development Team", email = "team@beastmode.dev"}
]
keywords = [
    "ai", "development", "framework", "systematic", "collaboration", "agents",
    "domain-driven-design", "ddd", "reflective-module", "architecture", "patterns",
    "enterprise", "microservices", "bounded-context"
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "redis>=4.5.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
    "dataclasses-json>=0.6.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "asyncio-mqtt>=0.13.0",
    "aiofiles>=23.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pillow>=11.3.0",
    "numpy>=2.0.2",
    "beautifulsoup4>=4.13.5",
    "requests>=2.32.5",
    "tomlkit>=0.13.3",
    "playwright>=1.55.0",
    "websocket-client>=1.8.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "pytest>=8.4.2",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
    "sphinx-autodoc-typehints>=1.23.0",
]
examples = [
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
]
testing = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.11.0",
    "factory-boy>=3.3.0",
]
all = [
    "beast-mode-framework[dev,docs,examples,testing]"
]

[project.urls]
Homepage = "https://beast-mode.dev"
Documentation = "https://beast-mode.readthedocs.io/"
Repository = "https://github.com/beast-mode/framework"
"Bug Tracker" = "https://github.com/beast-mode/framework/issues"
Ecosystem = "https://beast-mode.dev/ecosystem"

[project.scripts]
beast-mode = "beast_mode.messaging.cli:cli"
bm = "beast_mode.messaging.cli:cli"
beast = "beast_mode.messaging.cli:cli"
rm-ddd = "rm_ddd.cli:main"
devpost-cli = "devpost_integration.cli:main"
devpost = "devpost_integration.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rm_ddd = [
    "templates/**/*.j2",
    "stubs/**/*",
    "examples/**/*.py",
    "docs/**/*.md",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["beast_mode", "ghostbusters", "rm_ddd"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --disable-warnings --tb=short --timeout=30 --timeout-method=thread"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
timeout = 30
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "autoflake>=2.3.1",
    "bandit>=1.8.6",
    "black>=25.1.0",
    "flake8>=7.3.0",
    "isort>=6.0.1",
    "mypy>=1.17.1",
    "types-requests>=2.32.4.20250913",
]
