[server]
# Configure for subdomain access
root_url = https://grafana.observatory.nkllon.com/
serve_from_sub_path = false
domain = observatory.nkllon.com

[auth.anonymous]
# Enable anonymous access for public Beast Mode metrics viewing
enabled = true

# Organization for anonymous users
org_name = Main Org.

# CRITICAL: Read-only access only
org_role = Viewer

# Hide Grafana version for security
hide_version = true

[security]
# Additional security settings
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict

[users]
# Prevent anonymous users from signing up
allow_sign_up = false
allow_org_create = false

[dashboards]
# Prevent anonymous dashboard creation
default_home_dashboard_path = /var/lib/grafana/dashboards/beast-mode-performance-observatory.json