# Pre-commit hooks for Beast Mode Framework
# See https://pre-commit.com for more information
repos:
  # Code formatting and linting
  - repo: https://github.com/psf/black
    rev: '23.12.1'
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.8.0'
    hooks:
      - id: mypy
        additional_dependencies: [types-redis, types-requests]
        args: [--config-file=pyproject.toml]
        files: ^src/

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: '1.7.5'
    hooks:
      - id: bandit
        args: ['-r', 'src/', '-f', 'json']
        exclude: tests/

  # Observatory-specific tests (fast smoke tests only)
  - repo: local
    hooks:
      - id: observatory-smoke-tests
        name: Observatory Smoke Tests
        entry: python3 -m pytest tests/unit/beast_mode/observatory/test_simple_smoke.py -v --tb=line -x
        language: system
        files: ^(src/beast_mode/observatory/|tests/.*observatory.*)
        pass_filenames: false
        verbose: true

  # Documentation and markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--disable', 'MD013', 'MD033', 'MD041']

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix']

  # Python-specific checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-ast
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

# Configuration for running hooks
default_install_hook_types: [pre-commit, pre-push]
default_stages: [commit]

# Minimum version for compatibility
minimum_pre_commit_version: '2.20.0'

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [observatory-smoke-tests, observatory-critical-tests]  # Skip in CI, let main pipeline handle