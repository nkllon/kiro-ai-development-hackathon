version: '3.8'
networks:
  observatory:
    driver: bridge
volumes:
  prometheus_data: {}
  grafana_data: {}
  redis_data: {}
services:
  redis:
    image: redis:7-alpine
    container_name: observatory-redis
    restart: unless-stopped
    networks:
    - observatory
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes
  prometheus:
    image: prom/prometheus:latest
    container_name: observatory-prometheus
    restart: unless-stopped
    networks:
    - observatory
    ports:
    - 9090:9090
    volumes:
    - prometheus_data:/prometheus
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --storage.tsdb.retention.time=7d
    - --web.enable-lifecycle
  grafana:
    image: grafana/grafana:latest
    container_name: observatory-grafana
    restart: unless-stopped
    networks:
    - observatory
    ports:
    - 3000:3000
    volumes:
    - grafana_data:/var/lib/grafana
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
    - prometheus
  observatory:
    build:
      context: ../../
      dockerfile: deployment/observatory/Dockerfile
    image: beast-mode-observatory:latest
    container_name: beast-mode-observatory
    restart: unless-stopped
    networks:
    - observatory
    ports:
    - 8888:8888
    environment:
    - OBSERVATORY_HOST=0.0.0.0
    - OBSERVATORY_PORT=8888
    - LOG_LEVEL=INFO
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - PROMETHEUS_ENABLED=false
    - DISABLE_PROMETHEUS=true
    - SKIP_PROMETHEUS_INIT=true
    - DOCKER_DESKTOP=false
    depends_on:
    - redis
    - prometheus
    - grafana
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8888/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
