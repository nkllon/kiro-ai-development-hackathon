groups:
  - name: observatory.rules
    rules:
      - alert: ObservatoryDown
        expr: up{job="observatory"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Observatory service is down"
          description: "Observatory service has been down for more than 1 minute"
          
      - alert: ObservatoryHealthLow
        expr: observatory_health_score < 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Observatory health score is low"
          description: "Observatory health score is {{ $value }}, below threshold of 0.8"
          
      - alert: WebSocketConnectionsHigh
        expr: observatory_websocket_connections > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High number of WebSocket connections"
          description: "Observatory has {{ $value }} WebSocket connections, above normal threshold"