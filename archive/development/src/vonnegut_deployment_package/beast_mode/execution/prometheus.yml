# Prometheus configuration for Beast Mode framework monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "beast_mode_alerts.yml"

scrape_configs:
  # Beast Mode framework metrics
  - job_name: 'beast_mode_framework'
    static_configs:
      - targets: ['localhost:8000']
    scrape_interval: 5s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Optional: System metrics (if node_exporter is running)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s

  # Optional: Redis metrics (if redis_exporter is running)
  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 15s
