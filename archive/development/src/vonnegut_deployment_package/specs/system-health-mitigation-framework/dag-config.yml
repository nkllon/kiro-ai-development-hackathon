# Success criteria for DAG completion
success_criteria:
  technical:
    - service_auto_restart_success_above_99_percent
    - health_check_reliability_above_99_percent
    - disk_space_alerts_eliminated
    - configuration_drift_zero_unplanned_changes
    - automated_issue_resolution_above_90_percent

  operational:
    - cloudflare_tunnel_maintains_4_connections
    - directus_health_check_passes_consistently
    - observatory_health_score_accurate
    - prometheus_all_targets_reachable
    - manual_interventions_reduced_80_percent

  business:
    - system_availability_above_99_9_percent
    - mean_time_to_recovery_below_5_minutes
    - incident_volume_reduced_70_percent
    - team_productivity_increased_50_percent
    - documentation_completeness_100_percent

# RM-DDD compliance requirements
rm_ddd_compliance:
  reflective_module_pattern:
    required: true
    components:
      - health_monitoring
      - metrics_collection
      - graceful_degradation
      - systematic_error_handling
      - performance_monitoring

  interface_governance:
    check_registry: true
    prevent_duplication: true
    central_registration: true

  quality_gates:
    linting: true
    type_checking: true
    test_coverage_minimum: 90
    documentation_required: true
