# Alert Rules for Kiro AI Development Hackathon
# These rules define when Prometheus should send alerts

groups:
  - name: kiro-ai-systematic-pdca
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: systematic-pdca-orchestrator
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second for the last 5 minutes"

      # Service down alert
      - alert: ServiceDown
        expr: up{job="systematic-pdca-orchestrator"} == 0
        for: 1m
        labels:
          severity: critical
          service: systematic-pdca-orchestrator
        annotations:
          summary: "Systematic PDCA Orchestrator is down"
          description: "The systematic-pdca-orchestrator service has been down for more than 1 minute"

      # High memory usage alert
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 500
        for: 5m
        labels:
          severity: warning
          service: systematic-pdca-orchestrator
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }} MB, which is above the 500MB threshold"

      # High CPU usage alert
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          service: systematic-pdca-orchestrator
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }} cores, which is above the 0.8 threshold"

      # Slow response time alert
      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: systematic-pdca-orchestrator
        annotations:
          summary: "Slow response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

  - name: kiro-ai-infrastructure
    rules:
      # Prometheus target down
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: "Target {{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute"

      # High disk usage
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage detected"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      # Container restart alert
      - alert: ContainerRestart
        expr: increase(container_restart_count[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 5 minutes"
