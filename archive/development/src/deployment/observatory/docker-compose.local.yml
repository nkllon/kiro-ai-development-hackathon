version: '3.8'

# Local Development Docker Compose for Beast Mode Observatory
# Uses local msp-ssl-redis instead of remote Vonnegut Redis

networks:
  observatory-network:
    driver: bridge
  default:
    external: true
    name: kiro-ai-development-hackathon_msp-ssl-network

services:
  observatory:
    build:
      context: ../../
      dockerfile: deployment/observatory/Dockerfile
    container_name: beast-mode-observatory-local
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    environment:
      - OBSERVATORY_HOST=0.0.0.0
      - OBSERVATORY_PORT=8888
      - WEBSOCKET_PORT=8889
      - HEALTH_MONITOR_PORT=8890
      - LOG_LEVEL=INFO
      # LOCAL REDIS CONFIGURATION
      - REDIS_HOST=msp-ssl-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=mspssl123
      - REDIS_DB=0
      - PROMETHEUS_URL=http://observatory-prometheus:9090
      - GRAFANA_URL=http://observatory-grafana:3000
      - JAEGER_ENDPOINT=http://observatory-jaeger:14268/api/traces
      - ENGAGEMENT_URL=http://observatory-engagement-manager:8891
      - CACHE_BACKEND=redis
      - SESSION_BACKEND=redis
      - SHARED_STATE_BACKEND=redis
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8888/health
      timeout: 10s
    image: beast-mode-observatory:latest
    networks:
      - observatory-network
      - default  # Connect to default network to access msp-ssl-redis
    ports:
      - 8888:8888
      - 8889:8889
      - 8890:8890
    restart: unless-stopped
    volumes:
      - observatory_data:/app/data
      - observatory_logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - prometheus
      - grafana
      - jaeger

  prometheus:
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --storage.tsdb.retention.time=7d
    - --web.enable-lifecycle
    - --web.enable-remote-write-receiver
    container_name: observatory-prometheus-local
    image: prom/prometheus:latest
    networks:
      - observatory-network
    ports:
      - 9091:9090  # Use 9091 to avoid conflict with production
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  grafana:
    container_name: observatory-grafana-local
    depends_on:
    - prometheus
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    - GF_AUTH_DISABLE_LOGIN_FORM=false
    - GF_AUTH_DISABLE_SIGNOUT_MENU=false
    - GF_USERS_ALLOW_ORG_CREATE=false
    - GF_USERS_AUTO_ASSIGN_ORG=true
    - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
    # LOCAL REDIS SESSION
    - GF_SESSION_PROVIDER=redis
    - GF_SESSION_PROVIDER_CONFIG=addr=msp-ssl-redis:6379,password=mspssl123,pool_size=100,db=1
    - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-local-dev-secret-key}
    - GF_DATABASE_TYPE=sqlite3
    image: grafana/grafana:latest
    networks:
      - observatory-network
      - default  # Connect to default network to access msp-ssl-redis
    ports:
      - 3001:3000  # Use 3001 to avoid conflict with production
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-config:/etc/grafana/provisioning

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: observatory-jaeger-local
    restart: unless-stopped
    environment:
    - COLLECTOR_OTLP_ENABLED=true
    - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
    - 16687:16686  # Jaeger UI (use 16687 to avoid conflict)
    - 14269:14268  # Jaeger collector HTTP
    - 14251:14250  # Jaeger collector gRPC
    - 6833:6831/udp  # Jaeger agent UDP
    - 6834:6832/udp  # Jaeger agent UDP
    networks:
    - observatory-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  engagement-manager:
    build:
      context: ../../
      dockerfile: deployment/engagement/Dockerfile
    image: beast-mode-engagement:latest
    container_name: observatory-engagement-manager-local
    restart: unless-stopped
    environment:
    - ENGAGEMENT_HOST=0.0.0.0
    - ENGAGEMENT_PORT=8891
    - OBSERVATORY_URL=http://beast-mode-observatory-local:8888
    - JAEGER_ENDPOINT=http://observatory-jaeger-local:14268/api/traces
    # LOCAL REDIS CONFIGURATION
    - REDIS_HOST=msp-ssl-redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=mspssl123
    ports:
    - 8892:8891  # Use 8892 to avoid conflict
    volumes:
    - engagement_data:/app/data
    - engagement_logs:/app/logs
    networks:
    - observatory-network
    - default  # Connect to default network to access msp-ssl-redis
    depends_on:
    - observatory
    - jaeger
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  observatory_data:
    driver: local
  observatory_logs:
    driver: local
  engagement_data:
    driver: local
  engagement_logs:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local


