version: '3.8'

# Local Development Stack for Herbert (macOS)
# Uses host Redis and smart container detection

networks:
  beast-mode-local:
    driver: bridge

services:
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: local-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/observatory/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - beast-mode-local
    restart: unless-stopped

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: local-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DATABASE_TYPE=sqlite3
      # Use host Redis via smart detection
      - GF_SESSION_PROVIDER=redis
      - GF_SESSION_PROVIDER_CONFIG=addr=host.docker.internal:6379,pool_size=100,db=1
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/observatory/grafana-config:/etc/grafana/provisioning
    networks:
      - beast-mode-local
    depends_on:
      - prometheus
    restart: unless-stopped

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: local-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "14250:14250"  # Jaeger collector gRPC
      - "6831:6831/udp"  # Jaeger agent UDP
      - "6832:6832/udp"  # Jaeger agent UDP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - beast-mode-local
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Test ReflectiveModule Service
  test-reflective-service:
    build:
      context: .
      dockerfile: Dockerfile.test-reflective
    container_name: test-reflective-service
    environment:
      # Smart container detection will auto-resolve Redis host
      - REDIS_PORT=6379
      - REDIS_PASSWORD=  # Empty password for local Redis
      - BEAST_MODE_REDIS_ENABLED=true
      - PROMETHEUS_URL=http://local-prometheus:9090
      - JAEGER_ENDPOINT=http://local-jaeger:14268/api/traces
    networks:
      - beast-mode-local
    depends_on:
      - prometheus
      - grafana
      - jaeger
    restart: unless-stopped

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local