<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Chart Architecture Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: 'Monaco', 'Consolas', monospace;
            background: #1a1a1a;
            color: #f0f0f0;
            margin: 20px;
            line-height: 1.6;
        }
        .demo-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .chart-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            height: 300px;
        }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        .btn:hover {
            background: #2563eb;
        }
        .btn:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        .status {
            background: #1e293b;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            font-family: monospace;
        }
        .log {
            background: #0f172a;
            padding: 10px;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
            font-size: 12px;
            border: 1px solid #374151;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>🚀 Clean Chart Architecture Demo</h1>
        <p>Demonstration of the new clean, predictable chart update system</p>

        <div class="controls">
            <h3>🎮 Demo Controls</h3>
            <button id="singleUpdate" class="btn">Single Update</button>
            <button id="rapidUpdates" class="btn">Rapid Updates (10x)</button>
            <button id="stressTest" class="btn">Stress Test (100x)</button>
            <button id="forceRefresh" class="btn">Force Refresh</button>
            <button id="clearCharts" class="btn">Clear Charts</button>
            <button id="simulateError" class="btn">Simulate Error</button>
        </div>

        <div class="status">
            <h3>📊 Architecture Status</h3>
            <div id="architectureStatus">Initializing...</div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <canvas id="healthChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="costChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="performanceChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="activityChart"></canvas>
            </div>
        </div>

        <div class="status">
            <h3>📋 Update Log</h3>
            <div id="updateLog" class="log"></div>
            <button onclick="clearLog()" class="btn" style="font-size: 12px;">Clear Log</button>
        </div>
    </div>

    <script src="chart_architecture.js"></script>
    <script>
        /**
         * Demo of the Clean Chart Architecture
         * Shows how the new system prevents recursive updates and provides predictable behavior
         */
        class CleanChartDemo {
            constructor() {
                this.charts = {};
                this.coordinator = null;
                this.updateCount = 0;
                this.logContainer = document.getElementById('updateLog');
                this.statusContainer = document.getElementById('architectureStatus');

                this.initializeCharts();
                this.initializeArchitecture();
                this.setupEventListeners();

                this.log('Demo initialized successfully', 'success');
            }

            initializeCharts() {
                const chartConfigs = {
                    healthChart: {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                label: 'Health Score',
                                data: [],
                                borderColor: '#4ade80',
                                backgroundColor: 'rgba(74, 222, 128, 0.1)',
                                borderWidth: 2,
                                fill: true
                            }, {
                                label: 'Components',
                                data: [],
                                borderColor: '#60a5fa',
                                backgroundColor: 'rgba(96, 165, 250, 0.1)',
                                borderWidth: 2,
                                fill: false
                            }]
                        },
                        options: this.getChartOptions('Health Metrics')
                    },
                    costChart: {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                label: 'Total Cost ($)',
                                data: [],
                                borderColor: '#f87171',
                                backgroundColor: 'rgba(248, 113, 113, 0.1)',
                                borderWidth: 2,
                                fill: true
                            }]
                        },
                        options: this.getChartOptions('Cost Tracking')
                    },
                    performanceChart: {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                label: 'Response Time (ms)',
                                data: [],
                                borderColor: '#60a5fa',
                                backgroundColor: 'rgba(96, 165, 250, 0.1)',
                                borderWidth: 2,
                                fill: true
                            }]
                        },
                        options: this.getChartOptions('Performance')
                    },
                    activityChart: {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [{
                                label: 'Active Agents',
                                data: [],
                                borderColor: '#c084fc',
                                backgroundColor: 'rgba(192, 132, 252, 0.1)',
                                borderWidth: 2,
                                fill: true
                            }]
                        },
                        options: this.getChartOptions('Agent Activity')
                    }
                };

                // Create Chart.js instances
                Object.entries(chartConfigs).forEach(([canvasId, config]) => {
                    const ctx = document.getElementById(canvasId).getContext('2d');
                    this.charts[canvasId.replace('Chart', '')] = new Chart(ctx, config);
                });

                this.log('Charts initialized', 'info');
            }

            getChartOptions(title) {
                return {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: title,
                            color: '#f0f0f0'
                        },
                        legend: {
                            labels: {
                                color: '#f0f0f0'
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#9ca3af' },
                            grid: { color: 'rgba(156, 163, 175, 0.1)' }
                        },
                        y: {
                            ticks: { color: '#9ca3af' },
                            grid: { color: 'rgba(156, 163, 175, 0.1)' }
                        }
                    },
                    animation: {
                        duration: 500
                    }
                };
            }

            initializeArchitecture() {
                // Create mock API client for demo
                const mockApiClient = window.ChartArchitecture.ErrorHandler.createSafeApiClient();

                // Override get method for demo data
                mockApiClient.get = async (url) => {
                    // Simulate network delay
                    await new Promise(resolve => setTimeout(resolve, Math.random() * 200 + 100));

                    if (url === '/api/dashboard/all-data') {
                        return {
                            ok: true,
                            json: async () => this.generateMockData()
                        };
                    }
                    throw new Error('Unknown endpoint');
                };

                // Initialize the clean architecture
                this.coordinator = new window.ChartArchitecture.ChartUpdateCoordinator(
                    this.charts,
                    mockApiClient,
                    { debounceMs: 250 } // 250ms debounce for demo
                );

                this.log('Clean architecture initialized', 'success');
                this.updateStatus();
            }

            generateMockData() {
                const now = new Date();
                const timestamp = now.toLocaleTimeString('en-US', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                return {
                    analytics: {
                        healthScore: 0.8 + Math.random() * 0.2,
                        componentCount: Math.floor(Math.random() * 15) + 5
                    },
                    costs: {
                        totalCost: Math.random() * 100 + 20,
                        apiCalls: Math.floor(Math.random() * 2000) + 500
                    },
                    metrics: {
                        responseTime: Math.random() * 500 + 100,
                        errorRate: Math.random() * 10,
                        throughput: Math.random() * 200 + 50
                    },
                    agents: {
                        active: Math.floor(Math.random() * 10) + 1,
                        tasks: Math.floor(Math.random() * 50) + 10,
                        coordination: Math.random()
                    },
                    timestamp
                };
            }

            setupEventListeners() {
                document.getElementById('singleUpdate').onclick = () => this.performSingleUpdate();
                document.getElementById('rapidUpdates').onclick = () => this.performRapidUpdates();
                document.getElementById('stressTest').onclick = () => this.performStressTest();
                document.getElementById('forceRefresh').onclick = () => this.performForceRefresh();
                document.getElementById('clearCharts').onclick = () => this.clearAllCharts();
                document.getElementById('simulateError').onclick = () => this.simulateError();
            }

            async performSingleUpdate() {
                this.log('Requesting single update...', 'info');
                try {
                    const result = await this.coordinator.requestUpdate('manual-single');
                    this.log(`✅ Update completed: ${result.duration}ms`, 'success');
                    this.updateStatus();
                } catch (error) {
                    this.log(`❌ Update failed: ${error.message}`, 'error');
                }
            }

            async performRapidUpdates() {
                this.log('Performing rapid updates (should be debounced)...', 'warning');
                const startTime = Date.now();

                try {
                    const promises = [];
                    for (let i = 0; i < 10; i++) {
                        promises.push(this.coordinator.requestUpdate(`rapid-${i}`));
                    }

                    const results = await Promise.all(promises);
                    const duration = Date.now() - startTime;

                    this.log(`✅ 10 rapid updates completed in ${duration}ms (debounced)`, 'success');
                    this.log(`First result: ${results[0].source}, Last result: ${results[9].source}`, 'info');
                    this.updateStatus();
                } catch (error) {
                    this.log(`❌ Rapid updates failed: ${error.message}`, 'error');
                }
            }

            async performStressTest() {
                this.log('Starting stress test (100 updates)...', 'warning');
                this.disableControls(true);
                const startTime = Date.now();

                try {
                    const promises = [];
                    for (let i = 0; i < 100; i++) {
                        promises.push(this.coordinator.requestUpdate(`stress-${i}`));
                    }

                    await Promise.all(promises);
                    const duration = Date.now() - startTime;
                    const updatesPerSecond = (100 / duration * 1000).toFixed(1);

                    this.log(`✅ Stress test completed: ${duration}ms (${updatesPerSecond} updates/sec)`, 'success');
                    this.updateStatus();
                } catch (error) {
                    this.log(`❌ Stress test failed: ${error.message}`, 'error');
                } finally {
                    this.disableControls(false);
                }
            }

            async performForceRefresh() {
                this.log('Forcing cache refresh...', 'info');
                try {
                    const result = await this.coordinator.forceRefresh();
                    this.log(`✅ Force refresh completed: ${result.duration}ms`, 'success');
                    this.updateStatus();
                } catch (error) {
                    this.log(`❌ Force refresh failed: ${error.message}`, 'error');
                }
            }

            clearAllCharts() {
                Object.values(this.charts).forEach(chart => {
                    chart.data.labels = [];
                    chart.data.datasets.forEach(dataset => {
                        dataset.data = [];
                    });
                    chart.update();
                });
                this.log('All charts cleared', 'info');
            }

            async simulateError() {
                this.log('Simulating API error...', 'warning');

                // Temporarily break the API
                const originalGet = this.coordinator.dataAggregator.apiClient.get;
                this.coordinator.dataAggregator.apiClient.get = async () => {
                    throw new Error('Simulated network failure');
                };

                try {
                    await this.coordinator.requestUpdate('error-test');
                } catch (error) {
                    this.log(`❌ Expected error occurred: ${error.message}`, 'error');
                }

                // Restore API after 2 seconds
                setTimeout(() => {
                    this.coordinator.dataAggregator.apiClient.get = originalGet;
                    this.log('✅ API restored', 'success');
                }, 2000);
            }

            updateStatus() {
                const status = this.coordinator.getStatus();
                const schedulerStatus = status.scheduler || {};

                this.statusContainer.innerHTML = `
                    <div><strong>Updates:</strong> ${status.updateCount} total, ${status.errorCount} errors</div>
                    <div><strong>Last Update:</strong> ${status.lastUpdateTime ? new Date(status.lastUpdateTime).toLocaleTimeString() : 'Never'}</div>
                    <div><strong>Scheduler:</strong> ${schedulerStatus.pendingUpdates || 0} pending, executing: ${schedulerStatus.isExecuting || false}</div>
                    <div><strong>Charts:</strong> ${Object.keys(this.charts).length} initialized</div>
                `;
            }

            disableControls(disabled) {
                document.querySelectorAll('.btn').forEach(btn => {
                    btn.disabled = disabled;
                });
            }

            log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const className = type;
                const logEntry = document.createElement('div');
                logEntry.className = className;
                logEntry.innerHTML = `[${timestamp}] ${message}`;

                this.logContainer.appendChild(logEntry);
                this.logContainer.scrollTop = this.logContainer.scrollHeight;

                console.log(`[CleanChartDemo] ${message}`);
            }
        }

        // Helper function for clearing log
        function clearLog() {
            document.getElementById('updateLog').innerHTML = '';
        }

        // Initialize demo when page loads
        window.addEventListener('DOMContentLoaded', () => {
            window.chartDemo = new CleanChartDemo();
        });
    </script>
</body>
</html>
