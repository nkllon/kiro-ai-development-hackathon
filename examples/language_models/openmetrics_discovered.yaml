aggregation_rules:
  request_rate:
    rule_id: 2507f7a8-d1aa-4247-9d16-16f21a5e66d7
    metric_name: request_rate
    source_metrics:
    - http_requests_total
    aggregation_function: calculated
    window_size_seconds: 300
    calculation_logic: rate(http_requests_total[5m])
    business_context: Calculate per-second rate of HTTP requests
    domain: devops
    created_at: '2025-09-25T05:21:29.061808'
  error_ratio:
    rule_id: 0d2c9b96-4548-4abd-96fb-fd31b959945a
    metric_name: error_ratio
    source_metrics:
    - http_requests_total
    - http_errors_total
    aggregation_function: calculated
    window_size_seconds: 300
    calculation_logic: http_errors_total / http_requests_total
    business_context: Calculate error rate as ratio of failed to total requests
    domain: devops
    created_at: '2025-09-25T05:21:29.061817'
