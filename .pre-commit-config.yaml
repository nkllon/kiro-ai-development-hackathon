# Pre-commit hooks configuration for syntax validation and code quality
# Prevents indentation issues and maintains code standards

repos:
  # Python syntax validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-yaml
        name: Check YAML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: trailing-whitespace
        name: Remove trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with newline
      - id: check-case-conflict
        name: Check for case conflicts

  # Python syntax and formatting
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        name: Black code formatter
        language_version: python3
        args: [--line-length=100]

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort import sorter
        args: [--profile=black, --line-length=100]

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        name: Flake8 linter
        args: [--max-line-length=100, --extend-ignore=E203,W503]

  # Python syntax checking
  - repo: local
    hooks:
      - id: python-syntax-check
        name: Python syntax validation
        entry: python3 -m py_compile
        language: system
        types: [python]
        files: ^src/.*\.py$

      - id: code-generation-validation
        name: Code generation validation
        entry: python3 scripts/code_generation_validator.py
        language: system
        types: [python]
        files: ^src/.*\.py$
        pass_filenames: true

      - id: indentation-validation
        name: Indentation consistency validation
        entry: python3 scripts/indentation_validator.py
        language: system
        types: [python]
        files: ^src/.*\.py$
        pass_filenames: true

  # Custom Beast Mode validation
  - repo: local
    hooks:
      - id: beast-mode-interface-governance
        name: Beast Mode Interface Governance
        entry: python3 scripts/beast_mode_interface_governance.py
        language: system
        types: [python]
        files: ^src/.*\.py$
        pass_filenames: true

      - id: reflective-module-validation
        name: ReflectiveModule structure validation
        entry: python3 scripts/reflective_module_validator.py
        language: system
        types: [python]
        files: ^src/.*\.py$
        pass_filenames: true

# Configuration for pre-commit
default_language_version:
  python: python3

# Fail fast on first error
fail_fast: false

# Minimum pre-commit version
minimum_pre_commit_version: 3.0.0