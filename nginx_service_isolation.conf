# Nginx Service Isolation Configuration
# Properly routes Beast Mode services to avoid port conflicts

upstream prometheus_metrics {
    server localhost:9091;  # Dedicated metrics port
}

upstream empirical_data_api {
    server localhost:9092;  # Empirical data API
}

upstream beast_mode_dashboard {
    server localhost:9093;  # Beast Mode dashboard
}

server {
    listen 8080;
    server_name localhost;

    # Prometheus metrics endpoint
    location /metrics {
        proxy_pass http://prometheus_metrics/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Empirical data API
    location /api/empirical/ {
        proxy_pass http://empirical_data_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Beast Mode dashboard
    location /dashboard/ {
        proxy_pass http://beast_mode_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# Prometheus server (existing on 9090)
server {
    listen 9090;
    server_name localhost;
    
    location / {
        proxy_pass http://localhost:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}