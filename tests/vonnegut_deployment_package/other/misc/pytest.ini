[tool:pytest]
# Comprehensive pytest configuration for Beast Mode Framework

# Basic configuration
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    --timeout=30
    --timeout-method=thread
    --maxfail=10
    --durations=10

# Async configuration
asyncio_mode = auto
timeout = 30

# Markers
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    slow: marks tests as slow running tests
    requires_dependency: marks tests as requiring specific dependencies
    network: marks tests as requiring network access
    database: marks tests as requiring database access
    redis: marks tests as requiring Redis
    gcp: marks tests as requiring Google Cloud Platform
    devpost: marks tests as requiring DevPost API
    cli: marks tests as CLI tests
    api: marks tests as API tests
    security: marks tests as security tests
    memory: marks tests as memory intensive
    cpu: marks tests as CPU intensive
    io: marks tests as I/O intensive

# Test discovery
collect_ignore = 
    setup.py
    build
    dist
    *.egg-info
    venv
    env
    .venv
    .env

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S