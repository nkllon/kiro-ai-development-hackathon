# Systematic PDCA Orchestrator - Local Development
# Runs exactly like Cloud Run but on developer workstation

services:
  # Nginx reverse proxy - main entry point
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - systematic-pdca-orchestrator
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - systematic-pdca-local

  # Backend application service
  systematic-pdca-orchestrator:
    build:
      context: ../..
      dockerfile: deployment/systematic-pdca/Dockerfile
    expose:
      - "8080"
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - LOG_LEVEL=DEBUG
      - PORT=8080
    volumes:
      # Mount source code for hot reload during development
      - ../../src:/app/src:ro
      - ../../project_model_registry.json:/app/project_model_registry.json:ro
      - ../../learning_patterns:/app/learning_patterns
    healthcheck:
      test: ["CMD", "python", "-c", "from src.beast_mode.core.model_registry import ModelRegistry; r = ModelRegistry(); print('Health:', r.get_health_status()['status'])"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - systematic-pdca-local
    
  # Optional: Local monitoring (Prometheus-compatible)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
      - ../../logs:/var/log/prometheus:rw
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=1GB'
      - '--storage.tsdb.wal-compression'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--log.level=info'
      - '--log.format=json'
    environment:
      - PROMETHEUS_LOG_LEVEL=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    profiles:
      - monitoring
    
  # Optional: Local log aggregation
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=systematic
    volumes:
      - grafana-storage:/var/lib/grafana
    profiles:
      - monitoring

volumes:
  grafana-storage:
  prometheus-data:
  nginx-logs:

networks:
  systematic-pdca-local:
    driver: bridge