# Prometheus Configuration for Kiro AI Development Hackathon
# This configuration sets up monitoring for the systematic PDCA orchestrator

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'kiro-ai-local'
    environment: 'development'

# Rule files to be loaded
rule_files:
  - "alert_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  # Beast Mode Prometheus Exporter (direct)
  - job_name: 'beast-mode-metrics'
    static_configs:
      - targets: ['host.docker.internal:8001']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 5s

# Storage configuration (moved to command line arguments in docker-compose.yml)

# Remote write configuration (optional - for long-term storage)
