# SonarCloud Configuration for KIRO AI Development Hackathon
# Automated code quality, security, and maintainability analysis

# Project identification
sonar.projectKey=nkllon_kiro-ai-development-hackathon
sonar.organization=nkllon

# Metadata
sonar.projectName=Kiro AI Development Hackathon
sonar.projectVersion=1.0

# Source code paths
sonar.sources=src,scripts
sonar.tests=tests

# Python-specific settings
sonar.python.version=3.9,3.10,3.11,3.12

# File encoding
sonar.sourceEncoding=UTF-8

# Exclusions - exclude generated files, dependencies, archives, and temporary files
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/env/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/*.egg-info/**,\
  **/*.pyc,\
  **/backup*/**,\
  **/backups/**,\
  **/.cleanup-workspace/**,\
  **/.repair_backups*/**,\
  **/migration_backups/**,\
  **/htmlcov/**,\
  **/docs/**,\
  **/archive/**,\
  **/logs/**,\
  **/data/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**,\
  **/uv.lock

# Test exclusions
sonar.test.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/*_test.py

# Coverage reports (if generated)
# Uncomment and configure if you have coverage reports
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.python.xunit.reportPath=test-results.xml

# Duplication detection
sonar.cpd.exclusions=\
  **/tests/**,\
  **/examples/**

# Links
sonar.links.homepage=https://github.com/nkllon/kiro-ai-development-hackathon
sonar.links.ci=https://github.com/nkllon/kiro-ai-development-hackathon/actions
sonar.links.issue=https://github.com/nkllon/kiro-ai-development-hackathon/issues
sonar.links.scm=https://github.com/nkllon/kiro-ai-development-hackathon

# Quality Gate
# Enforce quality standards
sonar.qualitygate.wait=true

