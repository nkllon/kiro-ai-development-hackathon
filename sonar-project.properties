# SonarCloud Configuration for KIRO AI Development Hackathon
sonar.projectKey=nkllon_kiro-ai-development-hackathon
sonar.organization=nkllon

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=Kiro AI Development Hackathon
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Exclusions - exclude generated files, dependencies, and archives
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/*.egg-info/**,\
  **/archive/**,\
  **/logs/**,\
  **/data/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/.ruff_cache/**

# Optional: Coverage reports (uncomment if you generate coverage.xml)
#sonar.python.coverage.reportPaths=coverage.xml

