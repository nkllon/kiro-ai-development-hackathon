global:
  evaluation_interval: 15s
  scrape_interval: 15s
  external_labels:
    instance_id: 'local'
    datacenter: 'local'

# Load alerting rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Remote write to central Prometheus on vonnegut (disabled for now to fix startup)
# remote_write:
#   - url: 'http://vonnegut:9090/api/v1/write'
#     queue_config:
#       max_samples_per_send: 1000
#       batch_send_deadline: 5s
      
# Alerting configuration (disabled for now to fix startup)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'vonnegut:9093'

scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090

- job_name: observatory
  metrics_path: /metrics
  scrape_interval: 5s
  static_configs:
  - targets:
    - observatory:8888

- job_name: engagement-manager
  metrics_path: /metrics
  scrape_interval: 10s
  static_configs:
  - targets:
    - observatory-engagement-manager:8891

- job_name: jaeger
  metrics_path: /metrics
  scrape_interval: 30s
  static_configs:
  - targets:
    - observatory-jaeger:14269

- job_name: beast-mode-redis
  metrics_path: /metrics
  scrape_interval: 30s
  static_configs:
  - targets:
    - host.docker.internal:9122

- job_name: redis-exporter
  metrics_path: /metrics
  scrape_interval: 30s
  static_configs:
  - targets:
    - localhost:9121