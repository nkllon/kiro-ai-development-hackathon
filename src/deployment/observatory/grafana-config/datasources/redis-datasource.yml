apiVersion: 1

datasources:
  - name: Redis-Observatory
    type: redis-datasource
    access: proxy
    url: redis://msp-ssl-redis:6379
    database: 0
    jsonData:
      client: standalone
      poolSize: 5
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0
    secureJsonData:
      password: ""  # No password for local Redis
    isDefault: false
    editable: true
    orgId: 1
    version: 1